# 把同一个多架构镜像部署到新增的 Graviton3 节点组（ng-graviton-c7g / c7g.xlarge）
#
# 为什么不能只写 kubernetes.io/arch: arm64：
#   c6g 与 c7g 两个节点组的 arch 标签都是 arm64，只按架构选会落到任意一台 Graviton 节点上。
#   这里再加一个 node.kubernetes.io/instance-type 精确定位到 c7g 节点组
#   （等价写法：eks.amazonaws.com/nodegroup: ng-graviton-c7g，或自定义标签 demo.cpu: aws-graviton3）。
#
# 注意 labels 里用的是 arch: arm64-c7g，而不是 arm64：
#   deployment-arm64.yaml 的 selector 是 {app, arch: arm64}，
#   如果这里也写 arm64，两个 Deployment 的 selector 会互相"抢" Pod。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-arch-demo-c7g
  namespace: demo
  labels:
    app: java-arch-demo
    arch: arm64-c7g
spec:
  replicas: 2
  selector:
    matchLabels:
      app: java-arch-demo
      arch: arm64-c7g
  template:
    metadata:
      labels:
        app: java-arch-demo
        arch: arm64-c7g
    spec:
      # ---- 只落在 c7g.xlarge（Graviton3）节点组 ----
      nodeSelector:
        kubernetes.io/arch: arm64
        node.kubernetes.io/instance-type: c7g.xlarge
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NODE_GROUP
              value: ng-graviton-c7g
            - name: NODE_INSTANCE_TYPE
              value: c7g.xlarge
          resources:
            requests:
              cpu: 300m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
