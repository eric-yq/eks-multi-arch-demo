# 步骤 6 用：把**完全相同的镜像 tag**部署到新增的 Graviton 节点组。
#
# 与 deployment-amd64.yaml 逐字对比，只有两处不同：
#   1. nodeSelector 的 kubernetes.io/arch 从 amd64 变成 arm64
#   2. 标签 arch: arm64（用于区分两组 Pod，Service 仍然同时选中它们）
# 镜像地址、探针、资源、安全上下文全部一致——这就是多架构镜像的价值所在。
#
# 镜像与节点组信息由 scripts/06b-deploy-java-arm64.sh 替换占位符后 apply。
# 如果集群里有多个 arm64 节点组（例如同时存在 c6g 与 c7g），想精确指定其中一个，
# 在 nodeSelector 里再加一行即可：
#   node.kubernetes.io/instance-type: c7g.xlarge
#   或 eks.amazonaws.com/nodegroup: ng-graviton-c7g
apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-arch-demo-arm64
  namespace: demo
  labels:
    app: java-arch-demo
    arch: arm64
spec:
  replicas: 2
  selector:
    matchLabels:
      app: java-arch-demo
      arch: arm64
  template:
    metadata:
      labels:
        app: java-arch-demo
        arch: arm64
    spec:
      # ---- 架构选择：只落在 Graviton (arm64) 节点 ----
      nodeSelector:
        kubernetes.io/arch: arm64
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NODE_GROUP
              value: NODEGROUP_PLACEHOLDER
            - name: NODE_INSTANCE_TYPE
              value: INSTANCE_TYPE_PLACEHOLDER
          resources:
            requests:
              cpu: 300m
              memory: 512Mi
            limits:
              # 与 amd64 侧保持完全一致，否则多核对比不成立（见 deployment-amd64.yaml 的说明）
              cpu: "4"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
