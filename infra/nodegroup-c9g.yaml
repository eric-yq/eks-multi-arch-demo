# 增量添加的 Graviton5 节点组（1 x c9g.xlarge / ARM64）。
#
# ⚠️ 重要：这个文件**不能**直接用 `eksctl create nodegroup -f` 创建 c9g 节点组。
#
# eksctl 按硬编码的 Graviton 机型家族列表（a1/t4g/m6g/c6g/c7g/c8g/...）推断架构，
# c9g 不在列表里，会被当成 x86 并填入 amiType=AL2023_x86_64_STANDARD，EKS 拒绝：
#   [c9g.xlarge] is not a valid instance type for requested amiType AL2023_x86_64_STANDARD
# `--dry-run` 查不出这个问题：它只回显下面的 amiFamily，amiType 是生成 CFN 时才推断的。
# 参考：https://docs.aws.amazon.com/eks/latest/eksctl/arm-support.html
#
# 所以请用脚本创建（内部走 aws eks create-nodegroup 并显式指定 amiType）：
#   ./scripts/06-add-c9g-nodegroup.sh
#
# 本文件保留两个用途：
#   1. 作为节点组配置的可读说明（名称/机型/标签/容量与脚本保持一致）
#   2. 给 eksctl 认识的机型使用，例如 c6g/c7g/c8g：
#      USE_EKSCTL=true C9G_NODEGROUP=ng-graviton-c8g C9G_INSTANCE_TYPE=c8g.xlarge \
#        NODEGROUP_FILE=infra/nodegroup-c8g.yaml ./scripts/06-add-c9g-nodegroup.sh
#
# 为什么单独一个文件：eksctl create cluster 不支持 --include 过滤节点组，
# 如果把它写进 infra/cluster.yaml，步骤 1 建集群时就会一起把 Graviton 节点组建出来，
# 这个 demo 需要的恰恰是"先只有 x86，后面再加 Graviton"。
#
# 想换成 Graviton2 做对比：把 name 改成 ng-graviton-c6g、instanceType 改成 c6g.xlarge，
# 然后 C9G_NODEGROUP=ng-graviton-c6g NODEGROUP_FILE=infra/nodegroup-c6g.yaml ./scripts/06-add-c9g-nodegroup.sh
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

# 必须与 infra/cluster.yaml 中的集群一致；脚本会按 CLUSTER_NAME / AWS_REGION 自动渲染
metadata:
  name: multi-arch-demo
  region: us-east-1

managedNodeGroups:
  - name: ng-graviton-c9g
    amiFamily: AmazonLinux2023      # eksctl 依据实例类型自动选 arm64 版 AL2023 AMI
    instanceType: c9g.xlarge
    desiredCapacity: 1
    minSize: 1
    maxSize: 2
    volumeSize: 50
    volumeType: gp3
    privateNetworking: true
    labels:
      demo.arch: arm64
      demo.cpu: aws-graviton5
      demo.nodegroup: ng-graviton-c9g
      workload: java-demo
    tags:
      nodegroup-arch: arm64
      nodegroup-instance-type: c9g.xlarge
    iam:
      withAddonPolicies:
        cloudWatch: true
