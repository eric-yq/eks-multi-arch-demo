# eksctl 集群配置：一个 EKS 集群 + 两个托管节点组（x86 与 Graviton 各 1 台）
#
# 创建命令：
#   eksctl create cluster -f infra/cluster.yaml
#
# 说明：
#   本文件只创建 **一个 x86 节点组**，对应客户现状：集群里全是 x86 节点。
#   - ng-x86-c7i : 1 x c7i.xlarge  (AMD64 / x86_64)
#
#   Graviton 节点组是"增量"步骤，单独放在 infra/nodegroup-c9g.yaml，
#   由 scripts/06-add-c9g-nodegroup.sh 在集群已存在时添加。
#   （eksctl create cluster 没有 --include 过滤，所以两者必须分文件。）
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: multi-arch-demo
  region: us-east-1
  version: "1.36"
  tags:
    project: eks-multi-arch-demo
    environment: demo

# 为 IRSA / 插件启用 OIDC provider
iam:
  withOIDC: true

# 默认 VPC：3 个可用区（c7i / c6g / c9g 在 us-east-1a/b/c 均可用），公有 + 私有子网 + 单个 NAT 网关
# 注意：改这个列表前先查机型的 AZ 覆盖。c9g.xlarge 目前只在 us-east-1a/b/c/d 提供，
# us-east-1f 没有——把 f 放进来又要求 c9g 节点组落在 f 上就会创建失败。
# 查询：aws ec2 describe-instance-type-offerings --location-type availability-zone \
#        --filters Name=instance-type,Values=c9g.xlarge --region us-east-1
vpc:
  nat:
    gateway: Single
  clusterEndpoints:
    publicAccess: true
    privateAccess: true

availabilityZones:
  - us-east-1a
  - us-east-1b
  - us-east-1c

# 集群插件
addons:
  - name: vpc-cni
    resolveConflicts: overwrite
  - name: coredns
    resolveConflicts: overwrite
  - name: kube-proxy
    resolveConflicts: overwrite
  - name: eks-pod-identity-agent
    resolveConflicts: overwrite
  - name: metrics-server
    resolveConflicts: overwrite

managedNodeGroups:
  # ---------- 节点组 1：x86_64 ----------
  - name: ng-x86-c7i
    amiFamily: AmazonLinux2023
    instanceType: c7i.xlarge
    desiredCapacity: 1
    minSize: 1
    maxSize: 2
    volumeSize: 50
    volumeType: gp3
    privateNetworking: true
    labels:
      demo.arch: amd64
      demo.cpu: intel-x86
      workload: java-demo
    tags:
      nodegroup-arch: amd64
      nodegroup-instance-type: c7i.xlarge
    iam:
      withAddonPolicies:
        cloudWatch: true

  # Graviton 节点组不在这里定义：本 demo 的叙事是"先有一个纯 x86 集群，再增量加 Graviton"。
  # 新增 Graviton 节点组见 infra/nodegroup-c9g.yaml 与 scripts/06-add-c9g-nodegroup.sh。

cloudWatch:
  clusterLogging:
    enableTypes: ["api", "audit", "authenticator"]
    logRetentionInDays: 7
